<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="A static Southeast Asia map with selectable trip-planning datasets and an in-browser GeoJSON route editor."
        />
        <title>Southeast Asia trip planner</title>

        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.20.0/dist/leaflet-geoman.css"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <div
            id="map"
            role="application"
            aria-label="Interactive Southeast Asia trip-planning map"
        ></div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.20.0/dist/leaflet-geoman.min.js"></script>
        <script src="app.js"></script>
    </body>
</html>
